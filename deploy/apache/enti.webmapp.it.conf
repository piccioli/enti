<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName enti.webmapp.it

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Webapp (nginx nel container) esposta localmente da docker-compose su 127.0.0.1:${WEB_PORT}
    ProxyPass        / http://127.0.0.1:8082/
    ProxyPassReverse / http://127.0.0.1:8082/

    # SSL: sostituisci con i tuoi percorsi certificato (oppure usa certbot)
    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/enti.webmapp.it/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/enti.webmapp.it/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/enti.webmapp.it-error.log
    CustomLog ${APACHE_LOG_DIR}/enti.webmapp.it-access.log combined
</VirtualHost>
</IfModule>

<VirtualHost *:80>
    ServerName enti.webmapp.it
    # Redirect HTTP -> HTTPS (se mod_rewrite o Redirect disponibile)
    Redirect permanent / https://enti.webmapp.it/
</VirtualHost>

